[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.30", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
crossbeam = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tonic = "0.11"
prost = "0.12"
serde_yaml = "0.9"
smartcore = "0.3.2"
tokio-stream = "0.1"

[dependencies.rusqlite]
version = "0.31"
features = ["bundled"]

[dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Threading",
    "Win32_Security"
]

[build-dependencies]
tonic-build = "0.11"
