[package]
name = "ingest-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.30", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tonic = "0.11"
prost = "0.12"
async-nats = "0.33"
tokio-stream = "0.1"

# ClickHouse async client
clickhouse = { version = "0.12", features = ["uuid"] }

[build-dependencies]
tonic-build = "0.11"
