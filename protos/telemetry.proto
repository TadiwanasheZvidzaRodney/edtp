syntax = "proto3";

package edtp.telemetry.v1;

// OCSF-inspired minimal alert schema
message AlertEvent {
  string event_id = 1;
  string timestamp = 2; // ISO8601
  string endpoint_id = 3;
  string tenant_id = 4;
  int32 severity = 5;
  string message = 6;
  string category = 7;
}

service TelemetryService {
  rpc StreamAlerts (stream AlertEvent) returns (TelemetryResponse);
}

message TelemetryResponse {
  bool success = 1;
  string message = 2;
}
